name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: ESLint
        run: npm run eslint

      - name: Firestore security rules lint
        run: npx eslint -c eslint.rules.config.mjs firestore.rules

      - name: Unit & component tests (UTC)
        run: npm run test:run

      - name: Unit & component tests (Asia/Dhaka)
        env:
          TZ: Asia/Dhaka
        run: npm run test:run

      - name: Production build
        run: npm run build
